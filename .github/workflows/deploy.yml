
name: Deploy VOMP Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vomp-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -eu

            export NVM_DIR="/home/adarsharma/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 22.23.2

            cd /opt/venue-on-my-plate/admin

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            pm2 restart VOMP-ADMIN --update-env
            pm2 save

            sleep 3
            curl --fail --silent --show-error \
              http://127.0.0.1:3200/api/health
